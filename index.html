<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f3ee">
    <title>严若天</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Noto Serif SC", "Songti SC", "STSong", serif;
        background: #f5f3ee;
        color: #252720;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
      }

      main {
        display: grid;
        min-height: 100vh;
        min-height: 100svh;
        place-items: center;
        padding: 2rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(3.5rem, 12vw, 8rem);
        font-weight: 400;
        letter-spacing: 0.16em;
        text-indent: 0.16em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>严若天</h1>
    </main>
  </body>
</html>
